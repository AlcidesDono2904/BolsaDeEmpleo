<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registro Oferente</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h3>Registro de Oferente</h3>

        <form class="mt-4">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Identificación</label>
                    <input type="text" class="form-control" placeholder="Ej: 1-1234-5678">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nacionalidad</label>
                    <select class="form-select">
                        <option>Costarricense</option>
                        <option>Nicaragüense</option>
                        <option>Panameño</option>
                    </select>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control">
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Lugar de residencia</label>
                    <input type="text" class="form-control">
                </div>

            </div>

            <div class="mt-3">
                <button class="btn btn-success">Registrar</button>
                <a href="/" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
