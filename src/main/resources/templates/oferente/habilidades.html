<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Mis habilidades</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h3>Mis habilidades</h3>

        <div class="row">

            <!-- HABILIDADES ACTUALES -->

            <div class="col-md-4">

                <table class="table table-sm table-bordered">

                    <thead>
                    <tr>
                        <th>Característica</th>
                        <th>Nivel</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr>
                        <td>Lenguajes de programación</td>
                        <td>4</td>
                    </tr>

                    <tr>
                        <td>Lenguajes de programación / Java</td>
                        <td>5</td>
                    </tr>

                    <tr>
                        <td>Tecnologías Web</td>
                        <td>4</td>
                    </tr>

                    <tr>
                        <td>Bases de Datos / Modelado</td>
                        <td>5</td>
                    </tr>

                    <tr>
                        <td>Testing / JUnit / Assertions</td>
                        <td>3</td>
                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- ARBOL DE HABILIDADES -->

            <div class="col-md-4">

                <div class="card p-3">

                    <b>Ruta:</b>

                    <div class="mt-2">
                        <span class="badge bg-secondary">Testing</span>
                        <span class="badge bg-secondary">JUnit</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <span>Assertions</span>
                        <button class="btn btn-sm btn-outline-primary">Entrar</button>
                    </div>

                    <div class="d-flex justify-content-between mt-2">
                        <span>Test cases</span>
                        <button class="btn btn-sm btn-outline-primary">Entrar</button>
                    </div>

                </div>

            </div>

            <!-- AGREGAR HABILIDAD -->

            <div class="col-md-4">

                <div class="card p-3">

                    <h6>Agregar habilidad</h6>

                    <label class="form-label">Característica</label>

                    <select class="form-select">
                        <option>Assertions</option>
                        <option>Test cases</option>
                    </select>

                    <label class="form-label mt-3">Nivel (1-5)</label>

                    <input type="number" class="form-control" min="1" max="5">

                    <button class="btn btn-primary mt-3">
                        Agregar
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
