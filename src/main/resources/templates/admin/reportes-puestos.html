<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Generar Reporte de Puestos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">
    <div class="container mt-4">
        <h3>Reporte de Puestos por Mes</h3>

        <p class="text-muted">
            Selecciona un mes y año para generar el reporte en PDF con todos los puestos publicados.
        </p>

        <form method="post" action="/admin/descargar-reporte" class="mt-4">
            <div class="row">
                <div class="col-md-4">
                    <label for="mes" class="form-label">Mes</label>
                    <select id="mes" name="mes" class="form-select" required>
                        <option value="">Selecciona un mes</option>
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="anio" class="form-label">Año</label>
                    <input type="number" id="anio" name="anio" class="form-control"
                           th:value="${#dates.year(#dates.createNow())}" required>
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        Descargar PDF
                    </button>
                </div>
            </div>
        </form>

        <div class="alert alert-info mt-4" role="alert">
            <strong>Nota:</strong> El reporte incluirá todos los puestos publicados en el mes y año seleccionado,
            agrupados por empresa.
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>



</body>
</html>
