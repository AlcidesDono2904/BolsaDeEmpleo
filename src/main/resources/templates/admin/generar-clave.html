<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Generar clave</title>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">

  <div class="container mt-4">

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-dark text-white">
            <h4>Generar clave para usuario</h4>
          </div>
          <div class="card-body">
            <p><strong>Usuario:</strong> <span th:text="*{usuario.correo}"></span></p>

            <form action="/admin/aprobar-usuario" method="POST">
              <input type="hidden" name="id" th:field="*{usuario.id}">

              <div class="mb-3">
                <label for="password" class="form-label">Clave:</label>
                <input th:field="*{usuario.passwordHash}" type="password" class="form-control" id="password" name="passwordHash" required>
                <small class="form-text text-muted">Ingresa una clave</small>
              </div>

              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/admin/empresas-pendientes" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Aprobar y generar clave</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

</main>

<footer>
  <div th:replace="fragments/footer :: footer"></div>
</footer>

</body>
</html>
