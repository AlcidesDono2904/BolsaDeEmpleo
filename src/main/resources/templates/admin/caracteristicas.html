<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Características</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h3>Características</h3>

        <div class="row">

            <!-- LISTA DE CATEGORIAS -->

            <div class="col-md-7">

                <div class="card p-3" style="background-color:#e8f5e9">

                    <b>Ruta:</b>

                    <div class="mt-2">
                        <span class="badge bg-secondary">Raíces</span>
                        <div th:if="caracteristicaArbol != null" class="mt-2">
                            <span th:each="c, iterStat : ${caracteristicaArbol}" class="me-2">
                                <a class="btn btn-outline-primary btn-sm"
                                   th:href="@{/admin/caracteristicas(idPadre=${c.id})}"
                                   th:text="${c.nombre}"
                                >
                                    <span th:if="${!iterStat.last}" class="mx-1">/</span>
                                </a>
                            </span>
                        </div>
                    </div>

                    <p th:if="${caracteristicaSeleccionada == null}" class="mt-2 text-muted">Categorías: raíces</p>
                    <div th:if="${caracteristicaSeleccionada}">
                        <p th:text="|Subcategorias de:  ${caracteristicaSeleccionada.nombre}|"> </p>
                    </div>

                    <table class="table table-sm">
                        <tr th:each="caracteristica : ${caracteristicas}">
                            <td th:text="${caracteristica.nombre}"></td>
                            <td class="text-end">
                                <a class="btn btn-outline-primary btn-sm"
                                        th:href="@{/admin/caracteristicas(idPadre=${caracteristica.id})}"
                                >
                                    Entrar
                                </a>
                            </td>
                        </tr>
                    </table>

                </div>

            </div>

            <!-- AGREGAR CARACTERISTICA -->

            <div class="col-md-5">

                <div class="card p-3" style="background-color:#e8f5e9">

                    <h6>Agregar Característica</h6>

                    <label class="form-label mt-2">Nombre</label>
                    <input class="form-control">

                    <label for="selectPadre" class="form-label mt-3">Padre</label>

                    <select class="form-select" id="selectPadre">
                        <option>Bases de Datos</option>
                        <option>Tecnologías Web</option>
                        <option>Testing</option>
                    </select>

                    <button class="btn btn-primary mt-3">
                        Crear
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
