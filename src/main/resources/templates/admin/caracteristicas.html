<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Características</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h3>Características</h3>

        <div class="row">

            <!-- LISTA DE CATEGORIAS -->
            <div class="col-md-7">
                <div th:replace="~{fragments/listarCaracteristicas :: listarCaracteristicas}"></div>
            </div>


            <!-- AGREGAR CARACTERISTICA -->

            <div class="col-md-5">
                <div class="card p-3" style="background-color:#e8f5e9">

                    <h6>Agregar Característica</h6>
                    <form action="/admin/agregarCaracteristica" method="POST">

                        <label for="nombreCaracteristica" class="form-label mt-2">Nombre</label>
                        <input name="nombre" class="form-control" id="nombreCaracteristica" required>

                        <label for="selectPadre" class="form-label mt-3">Padre</label>

                        <select class="form-select" id="selectPadre" name="idPadre">

                            <option th:value="${null}">Sin padre</option>

                            <option th:each="car : ${caracteristicas}"
                                    th:value="${car.id}"
                                    th:text="${car.nombre}">
                            </option>
                        </select>

                        <button type="submit" class="btn btn-primary mt-3">
                            Crear
                        </button>
                    </form>
                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
