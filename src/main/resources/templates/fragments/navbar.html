<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
  <div class="container-fluid">

    <a class="navbar-brand" href="/">
      <img src="/img/empleo.png" width="30" class="me-2">
      BolsaEmpleo
    </a>

    <div class="navbar-nav">
      <a class="nav-link" href="/puestos/buscar">Buscar puestos</a>
      <a class="nav-link" href="empresa/registro-empresa">Registro Empresa</a>
      <a class="nav-link" href="oferente/registro-oferente">Registro Oferente</a>
    </div>

    <div class="ms-auto">
      <div th:if="${session.usuario == null}">
        <a class="nav-link text-white" href="/login">Login</a>
      </div>
      <div th:if="${session.usuario != null}"  class="d-flex gap-3 align-items-center">
        <div class="p-2">
          <span class="nav-link text-white" th:text="${session.usuario.correo}"></span>
        </div>
        <div class="p-2">
          <form th:action="@{/logout}" method="post">
            <a href="/logout" class="btn btn-outline-light">
              Logout
            </a>
          </form>
        </div>
      </div>
    </div>

  </div>
</nav>

</body>
</html>
