<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Publicar Puesto</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h3>Publicar Nuevo Puesto</h3>

        <form class="mt-4">

            <div class="mb-3">
                <label class="form-label">Descripción del puesto</label>
                <textarea class="form-control" rows="4"
                          placeholder="Ej: Desarrollador Java con experiencia en Spring Boot"></textarea>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Salario (USD)</label>
                    <input type="number" step="0.01" class="form-control" placeholder="Ej: 1200">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo de publicación</label>
                    <select class="form-select">
                        <option value="publica">Pública</option>
                        <option value="privada">Privada</option>
                    </select>
                </div>

            </div>

            <div class="mt-3">
                <button class="btn btn-success">Publicar Puesto</button>
                <a href="/empresa/dashboard" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
