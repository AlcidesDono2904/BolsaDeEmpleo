<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <title>Empresa - Candidatos</title>
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">
    <section>
        <div class="container mt-4">
            <h3 class="caption"> Candidatos para el puesto </h3>
            <p><strong>Puesto:</strong> <span th:text="${puesto.descripcion}">Full Stack Developer</span></p>
        </div>
        <article>
            <table class="table table-striped">

                <thead>
                <tr>
                    <th>Oferente</th>
                    <th>Requisitos cumplidos</th>
                    <th>% Coincidencia</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="candidato : ${candidatos}">
                    <td th:text="${candidato.getOferente().nombre}">Jose Sanchez</td>
                    <td th:text="${candidato.getRequisitosAlcanzados()}">1 / 1</td>
                    <td th:text="${candidato.getPorcentajeCompatibilidad()}">100.00%</td>
                    <td>
                        <a th:href="@{/empresa/candidatos/detalle(idPuesto=${candidato.getOferente().id})}" class="btn btn-outline-primary btn-sm">
                            Ver detalle
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <a href="/empresa/puestos" class="btn btn-secondary">
                Volver
            </a>
        </article>
    </section>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
