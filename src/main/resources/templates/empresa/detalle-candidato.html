<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Detalle candidato</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h3>Detalle de oferente</h3>

        <div class="card p-3 mb-4">

            <strong th:text="${oferente.nombre + ' ' + oferente.apellido}"></strong><br>

            <b>Identificación:</b> <span th:text="${oferente.identificacion}"></span><br>
            <b>Email:</b> <span th:text="${oferente.idUsuario.correo}"></span><br>
            <b>Teléfono:</b> <span th:text="${oferente.telefono}"></span><br>
            <b>Residencia:</b> <span th:text="${oferente.residencia}"></span><br>

        </div>

        <h5>Habilidades</h5>

        <table class="table">

            <thead>
            <tr th:each="h : ${habilidades}">
                <td th:text="${h.idCaracteristica.nombre}"></td>
                <td th:text="${h.nivel}"></td>
            </tr>
            </thead>

            <tbody>

            <tr>
                <td>Lenguajes de programación</td>
                <td>4</td>
            </tr>

            <tr>
                <td>Java</td>
                <td>5</td>
            </tr>

            <tr>
                <td>Tecnologías Web</td>
                <td>4</td>
            </tr>

            <tr>
                <td>Modelado</td>
                <td>5</td>
            </tr>

            <tr>
                <td>Assertions</td>
                <td>3</td>
            </tr>

            </tbody>

        </table>

        <a href="/empresa/candidatos" class="btn btn-secondary">
            Volver
        </a>

    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
