<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Mis puestos</title>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">

  <div class="container mt-4">

    <h3>Mis puestos</h3>

    <table class="table table-striped">

      <thead>
      <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>Salario</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
      </thead>

      <tbody>

      <tr th:each="p : ${puestos}">

        <td th:text="${p.id}">1</td>

        <td th:text="${p.descripcion}">Descripción</td>

        <td th:text="${p.salarioUsd}">0</td>

        <td>
    <span class="badge"
          th:classappend="${p.activo} ? 'bg-success' : 'bg-danger'"
          th:text="${p.activo} ? 'Sí' : 'No'">
    </span>
        </td>

        <td>
          <button class="btn btn-danger btn-sm">Desactivar</button>

          <a href="/empresa/candidatos" class="btn btn-primary btn-sm">
            Buscar candidatos
          </a>
        </td>

      </tr>

      </tbody>

    </table>

  </div>

</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
