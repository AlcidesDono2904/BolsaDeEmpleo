<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bolsa de Empleo</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">
<div class="container mt-4">

    <h2>Bolsa de Empleo</h2>
    <p>Últimos 5 puestos públicos</p>
</div>

<div class="row">

    <div class="col-md-4">
        <div class="card bg-light border-success mb-3">
            <div class="card-body">

                <h5>SoftLab</h5>
                <p>Unity game developer</p>

                <strong>€ 1300</strong>

                <br><br>

                <button class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#detallePuesto">
                    Ver detalle
                </button>

            </div>
        </div>
    </div>


    <div class="col-md-4">
        <div class="card bg-light border-success mb-3">
            <div class="card-body">

                <h5>SoftLab</h5>
                <p>Embedded software developer</p>

                <strong>€ 1500</strong>

                <br><br>

                <button class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#detallePuesto">
                    Ver detalle
                </button>

            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-light border-success mb-3">
            <div class="card-body">

                <h5>Web Soft</h5>
                <p>Full Stack Developer</p>

                <strong>€ 2000</strong>

                <br><br>

                <button class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#detallePuesto">
                    Ver detalle
                </button>

            </div>
        </div>
    </div>
</div>
</main>
    <div th:replace="fragments/footer :: footer"></div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div class="modal fade" id="detallePuesto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Frontend Developer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <ul>
                    <li>Tecnologías Web (nivel 3)</li>
                    <li>Testing / JUnit / Assertions (nivel 4)</li>
                </ul>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>

        </div>
    </div>
</div>
</html>
