<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar puestos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-fill">

    <div class="container mt-4">

        <h5>Buscar puestos por características</h5>

        <div class="card p-3">

            <!-- FORMULARIO -->
            <form method="get" action="/buscar">

                <div th:each="c : ${caracteristicas}" class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           name="caracteristicas"
                           th:value="${c.id}">
                    <label class="form-check-label" th:text="${c.nombre}"></label>
                </div>

                <button class="btn btn-primary mt-3">Buscar</button>
                <button type="reset" class="btn btn-secondary mt-3">Limpiar</button>

            </form>

        </div>


        <h5 class="mt-4">Resultados</h5>

        <div class="row mt-3">

            <div class="col-md-3 mb-3" th:each="p : ${puestos}">
                <div class="card p-3">

                    <strong th:text="${p.idEmpresa.nombre}">Empresa</strong><br>

                    <span th:text="${p.descripcion}">Descripcion</span><br>

                    <b>Salario: <span th:text="${p.salarioUsd}"></span></b>

                </div>
            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
