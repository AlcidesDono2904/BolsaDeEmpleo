<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar puestos</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">

<div class="container mt-4">

    <h5>Buscar puestos por características</h5>

    <div class="card p-3">

        <form method="get" action="/buscar">

            <label><input type="checkbox" name="caracteristicas" value="Motores">
                Motores</label><br>

            <label class="ms-3"><input type="checkbox" name="caracteristicas" value="MySql">
                MySql</label><br>
            <label class="ms-3"><input type="checkbox" name="caracteristicas" value="Oracle">
                Oracle</label><br>

            <label><input type="checkbox" name="caracteristicas" value="Ciberseguridad">
                Ciberseguridad</label><br>

            <label><input type="checkbox" name="caracteristicas" value="Lenguajes">
                Lenguajes de programación</label><br>

            <label class="ms-3"><input type="checkbox" name="caracteristicas" value="C#">
                C#</label><br>
            <label class="ms-3"><input type="checkbox" name="caracteristicas" value="Java">
                Java</label><br>
            <label class="ms-3"><input type="checkbox" name="caracteristicas" value="Kotlin">
                Kotlin</label><br>

            <label><input type="checkbox" name="caracteristicas" value="Web">
                Tecnologías Web</label><br><br>

            <button class="btn btn-primary">Buscar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>

        </form>

    </div>

    <h5 class="mt-4">Resultados</h5>

    <div class="row mt-3">

        <div class="col-md-3 mb-3" th:each="p : ${puestos}">
            <div class="card p-3">

                <strong th:text="${p.idEmpresa.nombre}">Empresa</strong><br>

                <span th:text="${p.descripcion}">Descripcion</span><br>

                <b>Salario: <span th:text="${p.salarioUsd}"></span></b>

            </div>
        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
