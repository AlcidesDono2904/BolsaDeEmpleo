<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar puestos</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-fill">

<div class="container mt-4">

    <h5>Buscar puestos por características</h5>

    <div class="card p-3">

        <form>

            <label><input type="checkbox"> Motores</label><br>

            <label class="ms-3"><input type="checkbox"> MySql</label><br>
            <label class="ms-3"><input type="checkbox"> Oracle</label><br>

            <label><input type="checkbox"> Ciberseguridad</label><br>

            <label><input type="checkbox"> Lenguajes de programación</label><br>

            <label class="ms-3"><input type="checkbox"> C#</label><br>
            <label class="ms-3"><input type="checkbox"> Java</label><br>
            <label class="ms-3"><input type="checkbox"> Kotlin</label><br>

            <label><input type="checkbox"> Tecnologías Web</label><br><br>

            <button class="btn btn-primary">Buscar</button>
            <button class="btn btn-secondary">Limpiar</button>

        </form>

    </div>

    <h5 class="mt-4">Resultados</h5>

    <div class="card p-3 col-md-3">

        <strong>Web Soft</strong><br>
        Frontend Developer<br>
        <b>Salario: 1200</b>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
